<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OGL Hub — Dateiaustausch</title>
  <link rel="stylesheet" href="./css/style.css?v=12" />
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <div id="brand-logo" class="brand-logo" aria-hidden="true"></div>
          <p id="brand-tagline" class="brand-tagline hidden"></p>
        </div>
        <h2 id="page-title" class="header-page-title hidden"></h2>
        <div class="header-actions">
          <span id="workshop-leader" class="hero-leader hidden"></span>
        </div>
      </div>
    </header>

    <main class="container main-content">
      <!-- Workshop-Code-Sperre -->
      <section id="portal-gate" class="admin-card login-card hidden">
        <h2>Workshop-Code erforderlich</h2>
        <p class="muted-text">Bitte gib den Workshop-Code ein, um Dateien und Chat zu öffnen.</p>
        <form id="portal-gate-form" class="stack-form">
          <input
            id="portal-code-input"
            type="password"
            class="search-input"
            placeholder="Workshop-Code"
            autocomplete="off"
            required
          />
          <div id="portal-gate-error" class="alert-error hidden"></div>
          <button id="portal-gate-btn" class="btn btn-primary" type="submit">Freischalten</button>
        </form>
      </section>

      <div id="portal-content" class="hidden">
        <section class="hero">
          <div class="hero-text">
            <p id="brand-description" class="hero-description"></p>
          </div>
          <div class="stats-bar">
            <span id="file-count" class="stat-pill">0 Dateien</span>
            <span id="last-updated" class="stat-pill muted">Stand: —</span>
          </div>
        </section>

        <section class="controls" aria-label="Suche und Filter">
          <div class="search-wrap">
            <input
              id="search-input"
              type="search"
              class="search-input"
              placeholder="Dateien durchsuchen (Name, Ordner, Typ)..."
              autocomplete="off"
            />
          </div>
          <div class="filter-row">
            <div id="category-pills" class="pill-group" role="tablist" aria-label="Ordner"></div>
            <div class="select-group">
              <select id="type-filter" class="select-input" aria-label="Nach Dateityp filtern">
                <option value="all">Alle Dateitypen</option>
                <option value="document">Dokumente &amp; PDF</option>
                <option value="image">Bilder</option>
                <option value="spreadsheet">Tabellen</option>
                <option value="archive">Archive</option>
                <option value="other">Sonstiges</option>
              </select>
              <select id="sort-select" class="select-input" aria-label="Sortierung">
                <option value="date-desc">Neueste zuerst</option>
                <option value="date-asc">Älteste zuerst</option>
                <option value="name-asc">Name (A–Z)</option>
                <option value="size-desc">Größe (absteigend)</option>
              </select>
            </div>
          </div>
        </section>

        <section id="file-list" class="file-grid" aria-live="polite"></section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-left">
          <a href="./admin.html" class="footer-login-link" title="Admin &amp; Upload" aria-label="Admin &amp; Upload">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </a>
          <nav id="footer-links" class="footer-links" aria-label="Rechtliches"></nav>
        </div>
        <div id="footer-provider" class="footer-provider hidden">
          <span id="footer-provider-label" class="footer-provider-label"></span>
          <img id="footer-provider-logo" class="footer-provider-logo" alt="" />
        </div>
      </div>
    </footer>
  </div>

  <!-- Vorschau-Modal -->
  <div id="preview-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h2 id="preview-title" class="modal-title">Vorschau</h2>
          <p id="preview-meta" class="modal-meta"></p>
        </div>
        <div class="modal-actions">
          <a id="preview-download" class="btn btn-primary" download>Herunterladen</a>
          <button class="icon-btn" type="button" data-close-modal aria-label="Schließen">✕</button>
        </div>
      </div>
      <div id="preview-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Aufklappbares Chat-Widget unten rechts (Supabase Realtime) -->
  <aside id="chat-widget" class="chat-widget collapsed hidden" aria-label="Chat">
    <button id="chat-bar" class="chat-bar" type="button" aria-expanded="false">
      <span class="chat-bar-left">
        <span id="chat-online-dot" class="chat-dot" title="Verbindungsstatus"></span>
        <span id="chat-title" class="chat-bar-title">OGL Chat</span>
        <span id="chat-count" class="chat-count hidden">0</span>
      </span>
      <span id="chat-chevron" class="chat-chevron" aria-hidden="true">▲</span>
    </button>

    <div id="chat-panel" class="chat-panel hidden">
      <!-- Namensabfrage vor Teilnahme -->
      <form id="chat-join-form" class="chat-join-box">
        <p class="chat-join-text">Gib deinen Namen ein, um am Chat teilzunehmen:</p>
        <input
          id="chat-join-name"
          type="text"
          class="chat-author-input"
          placeholder="Dein Name"
          maxlength="40"
          required
        />
        <div id="chat-join-error" class="alert-error hidden"></div>
        <button id="chat-join-btn" class="btn btn-primary" type="submit">Teilnehmen</button>
      </form>

      <!-- Aktiver Chat -->
      <div id="chat-room" class="chat-room hidden">
        <div class="chat-room-meta">
          <span>Dabei als <strong id="chat-current-name"></strong></span>
          <div class="chat-meta-actions">
            <div id="chat-color-picker" class="chat-color-picker" title="Eigene Pastellfarbe wählen"></div>
            <button id="chat-change-name" class="chat-link-btn" type="button">Name ändern</button>
          </div>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <div class="chat-input-row">
            <input
              id="chat-input"
              type="text"
              class="chat-text-input"
              placeholder="Nachricht schreiben..."
              maxlength="1000"
              required
            />
            <button class="btn btn-primary" type="submit">Senden</button>
          </div>
        </form>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js?v=12"></script>
</body>
</html>
